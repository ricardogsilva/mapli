name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:

  workflow_call:
    outputs:
      artifact_name:
        description: "Name of the uploaded wheel artifact"
        value: ${{ jobs.run_ci.outputs.artifact_name }}

jobs:
  # clippy runs as a check build, which cargo keeps separate from the regular build, so it needs its
  # own maplibre-native compile. Running it in its own job lets both compiles happen in parallel.
  lint_rust:
    runs-on: ubuntu-24.04
    env:
      # Route maplibre-native's from-source CMake build through ccache so C++ objects are reused across runs
      MLN_CMAKE_CXX_LAUNCHER: "ccache"
    steps:
      - name: "install system dependencies"
        run: |
          # these are taken from maplibre-native-rs' justfile
          sudo apt-get update
          sudo apt-get install -y \
              libgl1-mesa-dev \
              libegl1-mesa-dev \
              libgl1-mesa-dri \
              build-essential \
              libcurl4-openssl-dev \
              libuv1-dev \
              libz-dev \
              libfontconfig-dev \
              glslang-dev \
              glslang-tools \
              libicu-dev \
              libpng-dev \
              libjpeg-turbo8-dev \
              libwebp-dev \
              ccache \
              cmake \
              pkg-config

      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Cache maplibre-native C++ objects"
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 2G

      - name: "Format Rust code"
        run: cargo fmt --check

      - name: "Lint Rust code"
        run: cargo clippy -- --deny warnings

  run_ci:
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: "python-package"
      # Route maplibre-native's from-source CMake build through ccache so C++ objects are reused across runs
      MLN_CMAKE_CXX_LAUNCHER: "ccache"
    outputs:
      artifact_name: ${{ env.ARTIFACT_NAME }}
    steps:
      - name: "install system dependencies"
        run: |
          # these are taken from maplibre-native-rs' justfile
          sudo apt-get update
          sudo apt-get install -y \
              libgl1-mesa-dev \
              libegl1-mesa-dev \
              libgl1-mesa-dri \
              build-essential \
              libcurl4-openssl-dev \
              libuv1-dev \
              libz-dev \
              libfontconfig-dev \
              glslang-dev \
              glslang-tools \
              libicu-dev \
              libpng-dev \
              libjpeg-turbo8-dev \
              libwebp-dev \
              ccache \
              cmake \
              pkg-config \
              xvfb

      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Cache maplibre-native C++ objects"
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 2G

      - name: "Run Rust tests"
        run: cargo test --verbose

      - name: "Set up uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: "Install Python code with dev dependencies"
        run: uv sync --frozen --group dev

      - name: "Run ruff linter"
        run: uv run ruff check

      - name: "Run ruff formatter"
        run: uv run ruff format --check

      - name: "Run ty"
        run: uv run ty check

      # Runners have no GPU or display. MapLibre's EGL headless backend calls
      # eglGetDisplay(EGL_DEFAULT_DISPLAY), which needs a display to fall back to
      # Mesa's llvmpipe software renderer, so provide a virtual one.
      - name: "Run Python tests"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" uv run pytest

      # Release-mode build (another full maplibre-native compile), so only do it when the wheel gets uploaded
      - name: "Build mapli wheel"
        if: ${{ github.event_name != 'pull_request' }}
        run: uv build

      - name: "Upload built wheel as artifact"
        id: upload_package_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: dist/
          retention-days: 2
